name: Validate CRELICS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend ES-module syntax
        run: |
          for file in assets/crelics.js assets/app/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Validate Worker module syntax
        run: |
          for file in worker/index.js worker/core.js worker/providers/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Run core routing and safety regression tests
        run: node --test tests/*.test.cjs
      - name: Check required app shell
        run: |
          grep -q 'id="searchForm"' index.html
          grep -q 'id="lensbar"' index.html
          grep -q 'id="resultList"' index.html
          grep -q 'CRELICS' index.html
          grep -q 'assets/crelics.js' index.html
